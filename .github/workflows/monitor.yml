name: HOV Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (best-effort; GH can delay 1-15 min during peak)
  workflow_dispatch:         # manual trigger from Actions tab
    inputs:
      simulate_fail:
        description: 'Simulate a failure to test alerts'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: hov-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package.json') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: hov-monitor-state-${{ github.run_id }}
          restore-keys: hov-monitor-state-

      - name: Restore auth state cache
        uses: actions/cache/restore@v4
        with:
          path: auth-state.json
          key: hov-monitor-auth-${{ github.run_id }}
          restore-keys: hov-monitor-auth-

      - name: Run monitor
        id: monitor
        continue-on-error: true
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
        run: |
          if [ "${{ github.event.inputs.simulate_fail }}" = "true" ]; then
            node monitor.js --simulate-fail > result.json
          else
            node monitor.js > result.json
          fi

      - name: Save auth state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: auth-state.json
          key: hov-monitor-auth-${{ github.run_id }}

      - name: Print monitor result
        run: cat result.json

      - name: Notify
        env:
          ALERT_COOLDOWN_MIN: '30'
          PUSHOVER_USER:       ${{ secrets.PUSHOVER_USER }}
          # Website Alert app — used by notify.js when monitor.js detects site/booking page down
          PUSHOVER_TOKEN:      ${{ secrets.PUSHOVER_TOKEN_WEBSITE }}
          PUSHOVER_PRIORITY:   ${{ secrets.PUSHOVER_PRIORITY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:         ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:           ${{ secrets.TWILIO_TO }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
        run: node notify.js

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: hov-monitor-state-${{ github.run_id }}

      - name: Restore notified-bookings cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: notified-bookings.json
          # Specific prefix: "hov-monitor-notified-bookings-" — must NOT collide
          # with "hov-monitor-notified-orders-" or restore-keys would match both
          # and load the wrong file (orders content into bookings path).
          key: hov-monitor-notified-bookings-${{ github.run_id }}
          restore-keys: hov-monitor-notified-bookings-

      - name: Check for new bookings
        id: bookings
        if: always()
        continue-on-error: true
        env:
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          ADMIN_USER:           ${{ secrets.ADMIN_USER }}
          ADMIN_PASS:           ${{ secrets.ADMIN_PASS }}
          PUSHOVER_USER:        ${{ secrets.PUSHOVER_USER }}
          # Booking app — used by check-bookings.js (new admin/bookings notifications)
          PUSHOVER_TOKEN:       ${{ secrets.PUSHOVER_TOKEN_BOOKING }}
        run: node check-bookings.js

      - name: Save notified-bookings cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notified-bookings.json
          key: hov-monitor-notified-bookings-${{ github.run_id }}

      - name: Restore notified-orders cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: notified-orders.json
          key: hov-monitor-notified-orders-${{ github.run_id }}
          restore-keys: hov-monitor-notified-orders-

      - name: Check for new orders
        id: orders
        if: always()
        continue-on-error: true
        env:
          WC_KEY:         ${{ secrets.WC_KEY }}
          WC_SECRET:      ${{ secrets.WC_SECRET }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
          # Webshop app — used by check-orders.js (cha-ching at new WC orders)
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN_WEBSHOP }}
        run: node check-orders.js

      - name: Save notified-orders cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notified-orders.json
          key: hov-monitor-notified-orders-${{ github.run_id }}

      - name: Fail the run if monitor failed
        if: steps.monitor.outcome != 'success'
        run: |
          echo "Monitor reported a frontend problem. See result.json above."
          exit 1
