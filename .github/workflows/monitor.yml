name: HOV Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (best-effort; GH can delay 1-15 min during peak)
  workflow_dispatch:         # manual trigger from Actions tab
    inputs:
      simulate_fail:
        description: 'Simulate a failure to test alerts (Web Alerts bot)'
        required: false
        default: 'false'
      force_push_bookings:
        description: 'Re-push alle nuværende bookings én gang (tester Sales-bot via bookings)'
        required: false
        default: 'false'
      force_push_orders:
        description: 'Re-push alle nuværende ordrer én gang (tester Sales-bot via ordrer)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: hov-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package.json') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: hov-monitor-state-${{ github.run_id }}
          restore-keys: hov-monitor-state-

      - name: Run monitor
        id: monitor
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.simulate_fail }}" = "true" ]; then
            node monitor.js --simulate-fail > result.json
          else
            node monitor.js > result.json
          fi

      - name: Print monitor result
        run: cat result.json

      - name: Notify
        env:
          ALERT_COOLDOWN_MIN: '30'
          # Telegram: web-alerts bot + group. Falder tilbage til den generelle hvis _WEBSITE ikke er sat.
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN_WEBSITE || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID_WEBSITE || secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:         ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:           ${{ secrets.TWILIO_TO }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
        run: node notify.js

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: hov-monitor-state-${{ github.run_id }}

      - name: Restore notified-bookings cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: notified-bookings.json
          # Specific prefix: "hov-monitor-notified-bookings-" — must NOT collide
          # with "hov-monitor-notified-orders-" or restore-keys would match both
          # and load the wrong file (orders content into bookings path).
          key: hov-monitor-notified-bookings-${{ github.run_id }}
          restore-keys: hov-monitor-notified-bookings-

      - name: Check for new bookings
        id: bookings
        if: always()
        continue-on-error: true
        env:
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          ADMIN_USER:           ${{ secrets.ADMIN_USER }}
          ADMIN_PASS:           ${{ secrets.ADMIN_PASS }}
          # Telegram: sales-bot + booking-gruppe. Falder tilbage til generelle hvis _BOOKING ikke er sat.
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN_BOOKING || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID_BOOKING || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force_push_bookings }}" = "true" ]; then
            node check-bookings.js --force-push
          else
            node check-bookings.js
          fi

      - name: Save notified-bookings cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notified-bookings.json
          key: hov-monitor-notified-bookings-${{ github.run_id }}

      - name: Restore notified-orders cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: notified-orders.json
          key: hov-monitor-notified-orders-${{ github.run_id }}
          restore-keys: hov-monitor-notified-orders-

      - name: Check for new orders
        id: orders
        if: always()
        continue-on-error: true
        env:
          WC_KEY:             ${{ secrets.WC_KEY }}
          WC_SECRET:          ${{ secrets.WC_SECRET }}
          # Telegram: sales-bot + webshop-gruppe. Falder tilbage til generelle hvis _WEBSHOP ikke er sat.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_WEBSHOP || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID_WEBSHOP || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force_push_orders }}" = "true" ]; then
            node check-orders.js --force-push
          else
            node check-orders.js
          fi

      - name: Save notified-orders cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notified-orders.json
          key: hov-monitor-notified-orders-${{ github.run_id }}

      - name: Fail the run if monitor failed
        if: steps.monitor.outcome != 'success'
        run: |
          echo "Monitor reported a frontend problem. See result.json above."
          exit 1
